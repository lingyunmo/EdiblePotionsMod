name: Publisher (Release)

on:
  push:
    branches:
      - master
    paths:
      - 'gradle.properties'
  workflow_dispatch:

env:
  MINECRAFT_VERSION: 1.20.1
  JAVA_VERSION: 17

  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Read Version
        id: version
        run: |
          VERSION=$(grep 'mod_version' gradle.properties | awk -F'=' '{print $2}' | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            cat << 'CHANGELOG_EOF' > changelog.md
          Initial release.

          **Loaders:** Fabric · Forge
          **Minecraft:** ${{ env.MINECRAFT_VERSION }}
          **Java:** ${{ env.JAVA_VERSION }}
          CHANGELOG_EOF
          else
            {
              echo "## Changes since $PREV_TAG"
              echo ""
              echo "**Loaders:** Fabric · Forge"
              echo "**Minecraft:** ${{ env.MINECRAFT_VERSION }}"
              echo ""
              git log --pretty=format:"- %s" "$PREV_TAG..HEAD"
              echo ""
            } > changelog.md
          fi

      - name: Create Git Tag
        run: |
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Publish (CurseForge / Modrinth / GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1427235
          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"

          modrinth-id: kprWzdPB
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"

          github-token: "${{ env.GITHUB_TOKEN }}"

          name: "v${{ env.VERSION }} for Minecraft ${{ env.MINECRAFT_VERSION }}"
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: changelog.md

          files: |
            fabric/build/libs/!(*-dev|*-sources|*-shadow).jar
            forge/build/libs/!(*-dev|*-sources|*-shadow).jar

          loaders: |
            fabric
            forge

          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: "${{ env.JAVA_VERSION }}"
