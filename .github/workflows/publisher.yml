name: Publisher (Release)

on:
  push:
    branches:
      - master
    paths:
      - 'gradle.properties'
  workflow_dispatch:

env:
  MINECRAFT_VERSION: 1.20.1
  JAVA_VERSION: 17

  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Read Version
        run: |
          VERSION=$(grep 'mod_version' gradle.properties | awk -F'=' '{print $2}' | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build

      - name: Generate Changelog
        run: |
          # 找到上一个发布 tag（不是将要创建的），跨过废弃版本的间隔
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)

          # 按 convential commits 前缀分类所有提交
          categorize() {
            local prefix="$1" label="$2"
            local commits
            if [ -n "$PREV_TAG" ]; then
              commits=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" --grep="^$prefix" 2>/dev/null || true)
            else
              commits=$(git log --pretty=format:"- %s" --grep="^$prefix" 2>/dev/null || true)
            fi
            if [ -n "$commits" ]; then
              echo "### $label"
              echo ""
              echo "$commits"
              echo ""
            fi
          }

          cat > changelog.md << 'HEADER'
          | File | Platform |
          |------|----------|
          | `*-fabric-*.jar` | Fabric |
          | `*-forge-*.jar` | Forge |

          **Minecraft:** ${{ env.MINECRAFT_VERSION }}
          **Java:** ${{ env.JAVA_VERSION }}
          HEADER

          if [ -z "$PREV_TAG" ]; then
            echo "" >> changelog.md
            echo "> Initial release." >> changelog.md
            echo "" >> changelog.md
          else
            echo "" >> changelog.md
            echo "> All changes since \`$PREV_TAG\`" >> changelog.md
            echo "" >> changelog.md
          fi

          # 分类提交
          categorize "feat"     "Features"       >> changelog.md
          categorize "fix"      "Fixes"         >> changelog.md
          categorize "refactor" "Refactoring"   >> changelog.md
          categorize "docs"     "Documentation" >> changelog.md
          categorize "ci"       "CI / CD"       >> changelog.md

          # 其他未分类的提交
          if [ -n "$PREV_TAG" ]; then
            remaining=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" \
              --grep="^(feat|fix|refactor|docs|ci)" --invert-grep 2>/dev/null || true)
          else
            remaining=$(git log --pretty=format:"- %s" \
              --grep="^(feat|fix|refactor|docs|ci)" --invert-grep 2>/dev/null || true)
          fi
          if [ -n "$remaining" ]; then
            echo "### Other Changes" >> changelog.md
            echo "" >> changelog.md
            echo "$remaining" >> changelog.md
            echo "" >> changelog.md
          fi

      - name: Create Git Tag
        run: |
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Publish (CurseForge / Modrinth / GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1427235
          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"
          modrinth-id: kprWzdPB
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"
          github-token: "${{ env.GITHUB_TOKEN }}"

          name: "v${{ env.VERSION }} for Minecraft ${{ env.MINECRAFT_VERSION }}"
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: changelog.md

          files: |
            fabric/build/libs/!(*-dev|*-sources|*-shadow).jar
            forge/build/libs/!(*-dev|*-sources|*-shadow).jar

          loaders: |
            fabric
            forge

          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: "${{ env.JAVA_VERSION }}"
